<div
  class="initiative-standalone"
  [ngClass]="{ vertical: vertical(), fh: settingsManager.settings.theme === 'fh', modern: settingsManager.settings.theme === 'modern' }"
  ghs-keyboard-shortcuts
>
  <ghs-header #header [standalone]="true" [connection]="true"></ghs-header>

  <div class="scroll-container">
    @if (!!character) {
      <ghs-initiative-picker [character]="character" [vertical]="vertical()"></ghs-initiative-picker>
    }

    @if (notFound) {
      <div class="not-found" [ghs-label]="'character.fullview.notFound'" [ghs-label-args]="[characterParam || '']"></div>
    }

    @if (!fixed) {
      <ghs-standalone-character-chooser
        [characters]="characters"
        [selected]="character"
        [vertical]="vertical()"
        (characterSelect)="selectCharacter($event)"
        (characterOpen)="openCharacter($event)"
      ></ghs-standalone-character-chooser>
    }
  </div>
</div>
