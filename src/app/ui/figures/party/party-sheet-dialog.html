<div class="light party-sheet-dialog">
  <div class="scroll-container" [ngClass]="{ denied: gameManager.stateManager.permissions && !gameManager.stateManager.permissions.party }">
    <div
      class="container"
      [ngClass]="{
        'fh-container': !campaign && sheet === 'fh',
        'gh2e-container': !campaign && sheet === 'gh2e',
        'campaign-container': campaign
      }"
    >
      @if (campaign) {
        <ghs-party-sheet-campaign
          [edition]="partyEdition"
          [sheet]="sheet"
          [dialogRef]="dialogRef"
          [disableShortcuts]="disableShortcuts"
          (closeCampaign)="campaign = false"
          (editionChange)="partyEdition = $event"
        />
      } @else {
        @switch (sheet) {
          @case ('fh') {
            <ghs-party-sheet-fh
              [edition]="partyEdition"
              [sheet]="sheet"
              [dialogRef]="dialogRef"
              [disableShortcuts]="disableShortcuts"
              (openCampaign)="campaign = true"
            />
          }
          @case ('gh2e') {
            <ghs-party-sheet-gh2e
              [edition]="partyEdition"
              [sheet]="sheet"
              [dialogRef]="dialogRef"
              [disableShortcuts]="disableShortcuts"
              (openCampaign)="campaign = true"
            />
          }
          @default {
            <ghs-party-sheet-gh
              [edition]="partyEdition"
              [sheet]="sheet"
              [dialogRef]="dialogRef"
              [disableShortcuts]="disableShortcuts"
              (openCampaign)="campaign = true"
            />
          }
        }
        <ghs-party-sheet-menu [edition]="partyEdition" [sheet]="sheet" [dialogRef]="dialogRef" (toggleSheet)="toggleFhSheet()" />
      }
    </div>
  </div>
</div>
