@if (sheet === 'rpg') {
  <ghs-character-sheet-rpg [character]="character" [editable]="editable()" [forceEdit]="forceEdit()" [dialogRef]="dialogRef()" />
} @else {
  <div
    class="light character-sheet"
    [style.--ghs-character-color]="character.color"
    [ngClass]="{
      'cs-sheet': sheet === 'gh' && cs,
      'fh-sheet': sheet === 'fh',
      'gh2e-sheet': sheet === 'fh' && gh2e,
      compact: settingsManager.settings.characterSheetCompact
    }"
  >
    <div
      class="container"
      [ngClass]="{
        denied:
          (!forceEdit() && (!editable() || !gameManager.stateManager.characterPermissions[character.name + '|' + character.edition])) ||
          settingsManager.settings.characterSheetLocked,
        'view-only': (!forceEdit() && !editable()) || settingsManager.settings.characterSheetLocked
      }"
    >
      @if (sheet === 'fh') {
        <ghs-character-sheet-fh
          [character]="character"
          [editable]="editable()"
          [forceEdit]="forceEdit()"
          [dialogRef]="dialogRef()"
          [gh2e]="gh2e"
          (toggleSheet)="toggleFhSheet()"
        />
      } @else {
        <ghs-character-sheet-gh
          [character]="character"
          [editable]="editable()"
          [forceEdit]="forceEdit()"
          [dialogRef]="dialogRef()"
          [cs]="cs"
          (toggleSheet)="toggleFhSheet()"
        />
      }
    </div>

    @if (hasAbilities) {
      <div class="ability-cards" (click)="openAbilityCards()"></div>
    }
  </div>
}
