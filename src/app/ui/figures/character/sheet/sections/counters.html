@if (retirements()) {
  <div class="retirements">
    <label><span [ghs-label]="'character.progress.retirements'"></span>:</label>
    <input
      [value]="character.progress.retirements"
      type="number"
      min="0"
      (change)="setRetirements($event)"
      (keyup)="setRetirements($event)"
    />
  </div>
}
<div class="extra-perks">
  <label><span [ghs-label]="'character.progress.perks.extra'"></span>:</label>
  <input [value]="character.progress.extraPerks" type="number" min="0" (change)="setExtraPerks($event)" (keyup)="setExtraPerks($event)" />
</div>
