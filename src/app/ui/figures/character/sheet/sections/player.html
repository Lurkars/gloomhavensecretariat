<div class="name">
  @if (playerName) {
    <span> {{ playerName }}</span>
  } @else {
    <span>/</span>
  }
  <span class="spacer"></span>
  <a class="ignore-denied" (click)="statistics()" [ghs-tooltip]="'scenario.stats'"
    ><img class="ghs-svg" src="./assets/images/stats.svg"
  /></a>
</div>
<div class="player-number">
  <label><span [ghs-label]="'character.playerNumber'"></span>:</label>
  <input [value]="character.number" type="number" min="1" (change)="setPlayerNumber($event)" (keyup)="setPlayerNumber($event)" />
</div>
