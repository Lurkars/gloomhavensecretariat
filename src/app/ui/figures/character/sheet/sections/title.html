<div class="row title">
  <img [src]="character.iconUrl" />
  <label class="headline" [ghs-label]="character.absent ? 'character.absent' : 'character.present'" [ghs-label-attribute]="'title'">
    <div class="character-title">
      <span
        [ghs-label]="'character.progress.title'"
        [ghs-label-args]="[
          'data.character.' + character.edition + '.' + character.name,
          character.characterClass ? 'character.class.' + (character.gender ? character.gender + '.' : '') + character.characterClass : ''
        ]"
      ></span>
    </div>
    <img
      (click)="toggleCharacterAbsent()"
      class="absent"
      [src]="'./assets/images/status/' + (character.absent ? 'absent' : 'present') + '.svg'"
      [ghs-label]="character.absent ? 'character.present' : 'character.absent'"
      [ghs-label-attribute]="'title'"
    />
  </label>
</div>
