<div
  class="list ignore-denied"
  [ngClass]="{
    denied:
      !editable() ||
      settingsManager.settings.characterSheetLocked ||
      !gameManager.stateManager.characterPermissions[character.name + '|' + character.edition],
    'view-only': !editable() || settingsManager.settings.characterSheetLocked,
    compact: settingsManager.settings.characterSheetCompact
  }"
>
  @for (perk of character.perks | trackUUID; track perk._trackUUID; let i = $index) {
    <div class="perk">
      <div class="checkboxes" [ngClass]="{ combined: perk.combined }">
        @for (count of [] | ghsRange: perk.count; track count) {
          <span
            class="checkbox"
            [ngClass]="{
              checked: character.progress.perks[i] && character.progress.perks[i] > count,
              disabled:
                (!forceEdit() && (gameManager.game.state !== GameState.draw || gameManager.game.round > 0)) ||
                (character.progress.perks[i] <= count && availablePerks < count - character.progress.perks[i] + 1)
            }"
            ghs-pointer-input
            (singleClick)="addPerk(i, count + 1)"
            (doubleClick)="addPerk(i, count + 1, true)"
          ></span>
        }
      </div>
      <ghs-perk-label
        ghs-pointer-input
        (singleClick)="togglePerk(i)"
        (doubleClick)="togglePerk(i, true)"
        [ngClass]="{
          disabled:
            gameManager.game.state !== GameState.draw ||
            gameManager.game.round > 0 ||
            (availablePerks === 0 && !character.progress.perks[i])
        }"
        [perk]="perk"
      ></ghs-perk-label>
    </div>
  }
</div>
@if (availablePerks < 0) {
  <div class="warning" [ghs-label]="'game.attackModifiers.perks.warning'" [ghs-label-attribute]="'title'">
    <img class="ghs-svg" src="./assets/images/warning.svg" />
    <span [ghs-label]="'game.attackModifiers.perks.warning'"></span>
  </div>
}
@if (character.perkWarning) {
  <div class="wip" [ghs-label]="'wip'" [ghs-label-attribute]="'title'">
    <img class="ghs-svg" src="./assets/images/warning.svg" /> <span [ghs-label]="'game.attackModifiers.perks.wip'"></span>
  </div>
}
