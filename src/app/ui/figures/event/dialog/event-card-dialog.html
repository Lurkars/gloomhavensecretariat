<div class="event-card-dialog" ghs-pointer-input (singleClick)="close()" [ngClass]="{ closed: !opened, opened: opened }">
  <div class="event-card-container">
    <ghs-event-card
      [event]="eventCard"
      [spoiler]="spoiler"
      [disabled]="!interactive"
      [identifier]="flipped ? id : undefined"
      [select]="flipped && !!id ? id.selected : -1"
      [subSelect]="flipped && !!id ? id.subSelections : []"
      [checks]="flipped && !!id ? id.checks : []"
      (selectCard)="select($event)"
    ></ghs-event-card>
    @if (id && interactive) {
      <a class="button flip" (click)="toggleFlip($event)" [ghs-tooltip]="'game.events.deck.flipCard'">
        <img class="ghs-svg" src="./assets/images/sync.svg" />
      </a>
    }
  </div>
</div>
<div class="close-container" (click)="close()"></div>
